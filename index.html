                    <p>He leans over your desk. "I want a permanent cure. I want you to cut the <em>Toxin-X</em> gene entirely out of the pathogen's genome while it sits inside the human lung cells. Eradicate its weapon."</p>

                    <p>You load up your genetic modeling software. You need a pair of molecular scissors that are unfathomably precise.</p>
                    <hr class="border-slate-700 my-6">
                    <p class="font-mono text-sky-400 text-lg">How do you specifically target and cut ONLY the pathogen's DNA without shredding the human patient's entire genome?</p>
                `,
                progress: 85,
                choices: [
                    {
                        text: "Inject EcoRI restriction enzyme",
                        narrative: "You need powerful chemical scissors. You order a massive dose of the generic EcoRI enzyme to chop the pathogen's DNA to pieces inside the host.",
                        outcomeTitle: "Fatal Error",
                        outcomeText: "EcoRI is a generic restriction enzyme. The sequence it targets, GAATTC, appears millions of times naturally in the human genome. You just shredded the patient's own DNA alongside the pathogen, causing catastrophic cellular failure.",
                        type: "gameover", nextStage: "stage7"
                    },
                    {
                        text: "Expose patients to targeted UV radiation",
                        narrative: "Radiation breaks DNA bonds. You decide to blast the patients' lungs with highly targeted UV light to shatter the parasite's genome without drugs.",
                        outcomeTitle: "Neutral Delay",
                        outcomeText: "UV radiation causes random thymine dimers. It damages the pathogen and the human host indiscriminately, but it does not specifically target or delete the <em>Toxin-X</em> gene. The pathogen's repair mechanisms kick in, and it survives.",
                        type: "neutral", nextStage: "stage7"
                    },
                    {
                        text: "Deploy a custom CRISPR-Cas9 system",
                        narrative: "This requires a molecular sniper rifle, not a shotgun. You turn to the programmable immunity of bacteria. You engineer a custom guide RNA to ensure the Cas9 endonuclease only cleaves the parasite's lethal gene.",
                        outcomeTitle: "Target Locked",
                        outcomeText: "You successfully utilized the unparalleled precision of <strong>CRISPR-Cas9</strong>. The 20-nucleotide synthetic guide RNA ensures only the parasite's lethal gene is targeted and cleaved, permanently neutralizing its ability to produce the toxin without harming a single human cell!",
                        type: "success", nextStage: "stage8"
                    }
                ]
            },
            stage8: {
                title: "Stage 8: The Final Delivery",
                imageUrl: getTerminalImage("DELIVERY: NANOFORMULATION DEPLOYED"),
                text: `
                    <p>You have the CRISPR-Cas9 payload. It is a masterpiece of genetic engineering. But as you prepare the vials, the Head of Pharmacy calls with devastating news.</p>
                    <p>"Doctor, the patients' lungs are heavily scarred from the initial toxin exposure. Opportunistic bacteria have moved in. Every single critical patient now has severe, secondary bacterial pneumonia on top of the parasitic infection."</p>
                    <p>Your heart sinks. If you inject the naked CRISPR genetic material directly into their bloodstream, the body's natural nucleases will destroy it instantly before it ever reaches the lungs. And even if it did, the bacterial pneumonia will kill them before the parasite does.</p>
                    <p>You need a delivery vehicle that is nothing short of science fiction—something that can shield the fragile CRISPR payload from the blood stream, penetrate the thick lung tissue, and kill the bacterial infection simultaneously.</p>
                    <hr class="border-slate-700 my-6">
                    <p class="font-mono text-sky-400 text-lg">You stare at the pharmacological synthesis deck. How do you safely deliver the gene-editing payload and treat the pneumonia at the exact same time?</p>
                `,
                progress: 95,
                choices: [
                    {
                        text: "Administer naked plasmids via a nebulizer mask",
                        narrative: "The lungs are right there. You bypass the bloodstream entirely, putting the raw CRISPR plasmids into an oxygen mask and hoping the patients breathe enough of it deep into their alveoli.",
                        outcomeTitle: "Fatal Error",
                        outcomeText: "Naked plasmids are far too large, highly negatively charged, and unstable to cross the thick cell membranes of the lung epithelia without a viral or chemical vector. The CRISPR payload degrades instantly in the mucus. The patients succumb to the pneumonia.",
                        type: "gameover", nextStage: "stage8"
                    },
                    {
                        text: "Combine CRISPR and antibiotics in an oral capsule",
                        narrative: "Keep it simple. You pack the fragile genetic payload and heavy oral antibiotics into a gelatin capsule and have the nurses administer it.",
                        outcomeTitle: "Neutral Delay",
                        outcomeText: "The stomach acid and harsh digestive enzymes completely denature and destroy the CRISPR plasmids before they can even reach the intestines to enter the bloodstream. The antibiotic fights the pneumonia slightly, but the parasite remains armed. The patients are still dying.",
                        type: "neutral", nextStage: "stage8"
                    },
                    {
                        text: "Deploy a dual-action nanoparticle formulation",
                        narrative: "A problem this complex needs a highly sophisticated vehicle. You synthesize two separate nanoparticle systems: solid lipid nanoparticles (SLNs) to cloak the CRISPR payload, and a chitosan-based system to combat the bacteria.",
                        outcomeTitle: "Delivery Successful",
                        outcomeText: "The brilliant application of a dual-action nanoformulation saves the day. The systems work in perfect tandem—the SLNs seamlessly bypass the body's defenses to deliver the CRISPR payload directly into the parasite's cells, while the chitosan nanoparticles clear out the secondary bacterial infection.",
                        type: "success", nextStage: "epilogue"
                    }
                ]
            },
            epilogue: {
                title: "Epilogue: The Chimera Protocol",
                imageUrl: getTerminalImage("WARNING: SYNTHETIC CHIMERA DETECTED"),
                text: `
                    <p>The harsh, clinical fluorescent lights of the MKAK laboratory seem to soften as the first golden rays of morning sun breach the windows. You stand before the main command screen, the hum of the servers a comforting white noise behind you. On the glowing map of Malaysia, the flashing red quarantine zones in Pahang, Selangor, and Johor are slowly turning green.</p>
                    <p>The targeted CRISPR payload is actively snipping the <em>Toxin-X</em> gene out of existence across thousands of patients. People who were given hours to live are now breathing on their own, their ventilators switched off.</p>
                    <p>The laboratory doors slide open, and Datuk Radzi steps in. He looks ten years older than he did a month ago, but a massive, profound smile breaks across his face. He walks over and firmly clasps your shoulder.</p>
                    <p>"You did it, Doctor," he says, his voice thick with emotion. "The Ministry is officially standing down from Code Red. The Banjaran Agent is neutralized. You saved the country."</p>
                    <p>You allow yourself a deep, shuddering breath, the adrenaline finally leaving your system. The nightmare is over.</p>
                    <hr class="border-slate-700 my-6">
                    <p class="font-mono text-slate-400 tracking-widest text-center">THREE MONTHS LATER</p>
                    <hr class="border-slate-700 my-6">
                    <p>The pandemic is a fading memory. You are sitting at your desk late on a Friday evening, typing up the final genomic architecture report for the journal <em>Nature</em>, when the heavy, biometric blast doors of your private laboratory hiss open.</p>
                    <p>You look up, annoyed at the interruption. But it isn't Farah. Four armed military police officers step into the room, escorting a terrified-looking customs inspector carrying a sleek, titanium bio-containment cylinder. The inspector keys in a passcode, and the cylinder depressurizes with a hiss of freezing vapor. Inside is a single, glowing amber vial.</p>
                    <p>"We intercepted a black-market shipment at Port Klang," the inspector says, handing you a secure tablet. "The scanners couldn't identify it. We ran a preliminary genomic sequence."</p>
                    <p>You swipe through the data, your brow furrowing in confusion. You stare at the nucleotide sequence. It doesn't just read A, T, C, and G. There are <em>six</em> distinct letters on the screen. The organism possesses a fully expanded, completely synthetic genetic alphabet.</p>
                    <p>"It's not natural," you whisper, a cold knot tightening in your stomach. "Someone engineered this from scratch."</p>
                    <p>"And Doctor," the inspector adds grimly. "When our algorithms translated the synthetic spacer regions into binary... they found a message encoded directly into the reading frame."</p>
                    <div class="bg-black border border-red-900 p-4 rounded mt-6 font-mono text-red-500 text-sm md:text-base text-center leading-relaxed">
                        INITIAL TEST DEEMED SUCCESSFUL.<br>
                        BANJARAN PROTOTYPE DEFEATED BY TARGET.<br>
                        COMMENCING PHASE TWO.<br>
                        PREPARE FOR THE CHIMERA.
                    </div>
                `,
                progress: 100,
                choices: [
                    { 
                        text: "Restart Simulation", 
                        narrative: "",
                        type: "success", 
                        nextStage: "prologue" 
                    }
                ]
            }
        };

        let currentStageId = "prologue";

        const storyContainer = document.getElementById('story-container');
        const interactionArea = document.getElementById('interaction-area');
        const progressBar = document.getElementById('progress-bar');
        const stageIndicator = document.getElementById('stage-indicator');

        function renderStage(stageId) {
            const stage = gameData[stageId];
            
            progressBar.style.width = stage.progress + '%';
            if (stageId === 'prologue') {
                stageIndicator.classList.add('hidden');
            } else if (stageId === 'epilogue') {
                stageIndicator.classList.remove('hidden');
                stageIndicator.innerHTML = '<span class="text-blue-400">STATUS: CLASSIFIED</span>';
                stageIndicator.className = 'text-sm font-mono px-3 py-1 rounded-full border border-blue-400/20 bg-blue-400/10';
            } else {
                stageIndicator.classList.remove('hidden');
                stageIndicator.innerHTML = '<span class="text-emerald-400">STATUS: ACTIVE</span>';
                stageIndicator.className = 'text-sm font-mono px-3 py-1 rounded-full border border-emerald-400/20 bg-emerald-400/10';
            }

            storyContainer.innerHTML = `
                <h2 class="text-2xl font-bold text-slate-100 mb-6 font-mono border-b border-slate-700 pb-2">${stage.title}</h2>
                ${stage.imageUrl ? `<img src="${stage.imageUrl}" class="stage-image fade-in">` : ''}
                <div class="space-y-4 text-[1.05rem]">${stage.text}</div>
            `;
            
            storyContainer.classList.remove('fade-in');
            void storyContainer.offsetWidth; 
            storyContainer.classList.add('fade-in');

            renderChoices(stage.choices);
        }

        function renderChoices(choices) {
            interactionArea.innerHTML = '';
            const choiceList = document.createElement('div');
            choiceList.className = 'flex flex-col gap-4 fade-in';

            choices.forEach(choice => {
                const btn = document.createElement('button');
                
                if (!choice.outcomeText) {
                    btn.className = 'w-full text-center p-4 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-bold tracking-wide transition-colors shadow-lg';
                } else {
                    btn.className = 'choice-btn w-full text-left p-4 rounded-lg bg-slate-700/50 hover:bg-slate-700 border border-slate-600 flex items-center justify-between group';
                }

                btn.innerHTML = `
                    <div class="flex flex-col ${!choice.outcomeText ? 'items-center w-full' : 'w-5/6'}">
                        <span class="font-bold ${!choice.outcomeText ? 'text-lg text-white' : 'text-slate-200 text-lg'}">${choice.text}</span>
                        ${choice.narrative ? `<span class="text-sm ${!choice.outcomeText ? 'text-sky-200' : 'text-slate-400'} mt-2 italic leading-relaxed">${choice.narrative}</span>` : ''}
                    </div>
                    ${choice.outcomeText ? '<i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-sky-400 transition-colors ml-4 text-xl"></i>' : ''}
                `;
                
                btn.onclick = () => handleChoice(choice);
                choiceList.appendChild(btn);
            });

            interactionArea.appendChild(choiceList);
        }

        function handleChoice(choice) {
            if (!choice.outcomeText) {
                currentStageId = choice.nextStage;
                renderStage(currentStageId);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            let borderColor, icon, titleColor, buttonText, buttonColor;
            
            if (choice.type === 'gameover') {
                borderColor = 'border-red-500/50';
                titleColor = 'text-red-400';
                icon = '<i class="fa-solid fa-skull-crossbones"></i>';
                buttonText = 'Restart Sequence';
                buttonColor = 'bg-red-900/50 hover:bg-red-900 border-red-700 text-red-200';
            } else if (choice.type === 'success') {
                borderColor = 'border-emerald-500/50';
                titleColor = 'text-emerald-400';
                icon = '<i class="fa-solid fa-check-circle"></i>';
                buttonText = 'Proceed to Next Phase';
                buttonColor = 'bg-emerald-900/50 hover:bg-emerald-900 border-emerald-700 text-emerald-200';
            } else {
                borderColor = 'border-amber-500/50';
                titleColor = 'text-amber-400';
                icon = '<i class="fa-solid fa-triangle-exclamation"></i>';
                buttonText = 'Reassess Strategy';
                buttonColor = 'bg-amber-900/50 hover:bg-amber-900 border-amber-700 text-amber-200';
            }

            interactionArea.innerHTML = `
                <div class="fade-in bg-slate-900 border ${borderColor} rounded-xl p-6 shadow-lg">
                    <h3 class="text-xl font-bold ${titleColor} mb-3 flex items-center gap-2">
                        ${icon} ${choice.outcomeTitle}
                    </h3>
                    <p class="text-slate-300 leading-relaxed mb-6">${choice.outcomeText}</p>
                    <button id="next-btn" class="w-full py-3 px-4 rounded-lg border font-semibold tracking-wide transition-colors ${buttonColor}">
                        ${buttonText}
                    </button>
                </div>
            `;

            document.getElementById('next-btn').onclick = () => {
                currentStageId = choice.nextStage;
                renderStage(currentStageId);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
        }

        window.onload = () => {
            renderStage(currentStageId);
        };
    </script>
</body>
